# \u00BB is » (double >>)
prefix: "&8[&bGrimAC&8]"

alerts-enabled: "%prefix% &aMonitoring active. Alerts enabled."
alerts-disabled: "%prefix% &cMonitoring paused. Alerts disabled."
verbose-enabled: "%prefix% &eVerbose output enabled (Debugging mode)."
verbose-disabled: "%prefix% &7Verbose output disabled."

# Makes brand joins very obvious so you can see who is on Fabric/Meteor
client-brand-format: "%prefix% &e[BRAND] &f%player% &7is using: &b%brand%"

# The main alert line - tuned to be highly readable in console
# Red [!!] symbol makes it easy to find when scrolling
alerts-format: "%prefix% &c[!!] &f%player% &bFAILED &e%check_name%%experimental% &7| &fVL: &c%vl% &7| &fData: &7%verbose%"
alerts-format-proxy: "%prefix% &c[!!] &f[&4PROXY&f] %player% &bFAILED &e%check_name% &7| &fVL: &c%vl%"

experimental-symbol: "&c[EXP]"

# Profile section updated to show info more clearly for audits
profile:
    - "&7&m----------------------------"
    - "%prefix% &bAudit for &f%player%"
    - "&b» Ping: &f%ping%ms"
    - "&b» Client: &f%brand% &7(%version%)"
    - "&b» Sensitivity: &fH:%h_sensitivity%% V:%v_sensitivity%%"
    - "&b» FastMath: &f%fast_math%"
    - "&7&m----------------------------"

grim-history-header: "%prefix% &eViolations for &f%player% &7(Page %page%/%maxPages%)"
grim-history-entry: "%prefix% &7[%server%] &e%check% &7(x&c%vl%&7) &f%timeago% ago &7[%verbose%]"
