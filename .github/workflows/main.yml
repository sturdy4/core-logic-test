name: Minecraft Server Runner
concurrency:
  group: minecraft-server
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download & Prepare Plugins
        run: |
          mkdir -p plugins/connect
          mkdir -p plugins/AuthMe
          mkdir -p plugins/PlayerStats
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          if [ -f "plugins/connect/config.yml" ]; then
            echo "✅ Manual config.yml detected."
          else
            echo "❌ ERROR: No config.yml found in plugins/connect/!"
            exit 1
          fi
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # --- NGROK SETUP ---
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # Start ngrok tunnel for your CUSTOM HTML CONSOLE (Port 8080)
          ngrok http 8080 --log=stdout > ngrok.log &
          sleep 5
          echo "🔗 CUSTOM COMMAND CONSOLE LINK:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          
          # --- CREATE CUSTOM CONSOLE SCRIPT ---
          cat << 'EOF' > console.js
          const http = require('http');
          const fs = require('fs');
          http.createServer((req, res) => {
            if (req.method === 'POST') {
              let body = '';
              req.on('data', chunk => { body += chunk.toString(); });
              req.on('end', () => {
                const params = new URLSearchParams(body);
                const cmd = params.get('cmd');
                if (cmd) {
                  fs.appendFileSync('server_input', cmd + '\n');
                  res.writeHead(200, {'Content-Type': 'text/html'});
                  res.end('<h3>Command Sent: ' + cmd + '</h3><a href="/">Back</a>');
                }
              });
            } else {
              res.writeHead(200, {'Content-Type': 'text/html'});
              res.end(`
                <html><body style="background:#121212;color:white;font-family:sans-serif;text-align:center;padding-top:50px;">
                  <h2>Minecraft Remote Console</h2>
                  <form method="POST" style="margin-top:20px;">
                    <input name="cmd" placeholder="type command here..." style="padding:10px;width:300px;border-radius:5px;border:none;" autofocus>
                    <button style="padding:10px 20px;background:#5865F2;color:white;border:none;border-radius:5px;cursor:pointer;">Send</button>
                  </form>
                </body></html>
              `);
            }
          }).listen(8080);
          EOF

          # Start Custom Console in background
          node console.js &

          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi
          if [ -f server.properties ]; then
            sed -i "s/online-mode=.*/online-mode=false/" server.properties
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          # AUTO-SAVE LOOP
          (
            while true; do
              sleep 600
              if [ -p server_input ]; then
                echo "save-all" > server_input
                echo "say [Auto-Save] Progress secured to disk." > server_input
              else
                break
              fi
            done
          ) & 
          
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -Dsun.net.inetaddr.ttl=0 -Dio.netty.eventLoopThreads=8 -jar server.jar nogui &
          SERVER_PID=$!
          
          sleep 350m
          echo "stop" > server_input
          wait $SERVER_PID
          rm -f server_input

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          rm -rf plugins/DiscordSRV/ logs/
          rm -f plugins/connect/token.json ngrok.log console.js
          find plugins/ -name ".git" -exec rm -rf {} +
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
          curl -L -X POST -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
