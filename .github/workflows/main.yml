name: Minecraft Server Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Configure Plugins
        run: |
          mkdir -p plugins/connect
          
          # Download Minekube Connect
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          
          # Download Kryptonite for lag reduction
          curl -L -o plugins/Kryptonite.jar https://github.com/mizofumi0411/Kryptonite/releases/latest/download/Kryptonite-Bukkit.jar
          
          # Configure Minekube Endpoint
          cat <<EOF > plugins/connect/config.yml
          endpoint: "binwalksmp"
          EOF
          
          # Configure Minekube Token
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          # Inject Discord Token for this session only
          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          # 10-MINUTE AUTO-SAVE LOOP (Insurance for Cancellations)
          (
            while true; do
              sleep 600
              echo "save-all" > server_input
              echo "say [Auto-Save] Progress secured to disk." > server_input
            done
          ) & 

          # Optimized startup flags for Networking and CPU efficiency
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -Dsun.net.inetaddr.ttl=0 -Dio.netty.eventLoopThreads=8 -jar server.jar nogui &
          
          # Wait 350 minutes before the 6-hour cycle
          sleep 350m
          
          echo "say Server cycling for auto-save. Back in 2 minutes!" > server_input
          echo "save-all" > server_input
          echo "stop" > server_input
          wait $!

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          
          # 1. PREVENT SUBMODULE ERRORS (Removes hidden .git folders in plugins)
          find plugins/ -name ".git" -exec rm -rf {} +
          
          # 2. CLEANUP TEMP/SENSITIVE FILES
          rm -f server_input
          rm -f plugins/connect/token.json
          rm -rf logs/
          
          # 3. SELECTIVE SAVE (Ensures World & Player progress is saved, but Secrets are NOT)
          git add world/ world_nether/ world_the_end/
          git add plugins/Essentials/userdata/
          git add plugins/LuckPerms/
          git add plugins/PlayerPoints/
          
          # 4. PUSH CHANGES TO GITHUB
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
          
          # 5. TRIGGER NEXT 6-HOUR RUN
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
