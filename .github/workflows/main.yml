name: Minecraft Server Runner

concurrency:
  group: minecraft-server
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Configure Plugins
        run: |
          mkdir -p plugins/connect
          mkdir -p plugins/AuthMe
          mkdir -p plugins/PlayerStats
          
          # Download Minekube Connect JAR only
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          
          # We no longer 'cat' the config.yml here so it uses your saved version from Git.
          
          # We still inject the Token for security (don't save this file to Git)
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi

          if [ -f server.properties ]; then
            sed -i "s/online-mode=.*/online-mode=false/" server.properties
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          (
            while true; do
              sleep 600
              echo "save-all" > server_input
              echo "say [Auto-Save] Progress secured to disk." > server_input
            done
          ) & 

          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -Dsun.net.inetaddr.ttl=0 -Dio.netty.eventLoopThreads=8 -jar server.jar nogui &
          
          sleep 350m
          
          echo "say Server cycling for auto-save. Back in 2 minutes!" > server_input
          echo "save-all" > server_input
          echo "stop" > server_input
          wait $!

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          
          find plugins/ -name ".git" -exec rm -rf {} +
          
          # CLEANUP: Remove the token so it isn't accidentally committed
          rm -f server_input
          rm -f plugins/connect/token.json
          rm -rf logs/

          # SELECTIVE SAVE (Including the Connect Config)
          git add world/ world_nether/ world_the_end/
          git add plugins/Essentials/userdata/
          git add plugins/LuckPerms/
          git add plugins/PlayerPoints/
          git add plugins/AuthMe/
          git add plugins/PlayerStats/
          git add plugins/Kryptonite/
          git add plugins/connect/config.yml  # <--- This locks in your 'passthrough: true'
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
