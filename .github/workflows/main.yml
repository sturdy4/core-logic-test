name: Minecraft Server Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]

jobs:
  run:
    runs-on: ubuntu-latest
    # Added permissions so the bot can trigger the next run
    permissions:
      contents: write
      actions: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Minekube Connect
        run: |
          mkdir -p plugins/connect
          cat <<EOF > plugins/connect/config.yml
          token: "${{ secrets.MINEKUBE_TOKEN }}"
          endpoint: "binwalksmp"
          EOF

      - name: Run Server with Auto-Save
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          chmod +x server.jar
          
          mkfifo server_input
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -jar server.jar nogui &
          
          # Wait 350 minutes
          sleep 350m
          
          echo "say Server cycling for auto-save. Back in 2 minutes!" > server_input
          echo "save-all" > server_input
          echo "stop" > server_input
          wait $!

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          
          rm -f server_input
          rm -rf logs/
          
          # Stage and push world changes
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          fi
          
          # TRIGGER THE NEXT RUN
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
