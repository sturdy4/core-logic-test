name: Minecraft Server Runner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Configure Minekube
        run: |
          # 1. Download the actual bridge plugin so it shows up in /plugins
          mkdir -p plugins/connect
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          
          # 2. Create the config so it knows which endpoint to link to
          cat <<EOF > plugins/connect/config.yml
          token: "${{ secrets.MINEKUBE_TOKEN }}"
          endpoint: "binwalksmp"
          EOF

      - name: Run Server with Auto-Save
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          # Inject Discord Token into config
          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi
          
          chmod +x server.jar
          
          # Create pipe for console commands
          mkfifo server_input
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -jar server.jar nogui &
          
          # Wait 350 minutes before cycling
          sleep 350m
          
          echo "say Server cycling for auto-save. Back in 2 minutes!" > server_input
          echo "save-all" > server_input
          echo "stop" > server_input
          wait $!

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          
          # Cleanup before push
          rm -f server_input
          rm -rf logs/
          
          git add .
          # Only commit if there are world changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          fi
          
          # Trigger the loop
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
