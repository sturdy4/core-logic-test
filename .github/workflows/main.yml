name: Minecraft Server Runner
concurrency:
  group: minecraft-server
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download & Prepare Plugins
        run: |
          mkdir -p plugins/connect
          mkdir -p plugins/AuthMe
          mkdir -p plugins/PlayerStats
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json
          
          if [ ! -f "plugins/connect/config.yml" ]; then
            echo "❌ ERROR: No config.yml found in plugins/connect/!"
            exit 1
          fi

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # --- NGROK SETUP ---
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          ngrok http 8080 --log=stdout > ngrok.log &
          sleep 5
          echo "🔗 LIVE LOGS & COMMAND CONSOLE LINK:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          
          # --- CREATE ENHANCED CUSTOM CONSOLE SCRIPT ---
          cat << 'EOF' > console.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');

          http.createServer((req, res) => {
            if (req.method === 'POST') {
              let body = '';
              req.on('data', chunk => { body += chunk.toString(); });
              req.on('end', () => {
                const params = new URLSearchParams(body);
                const cmd = params.get('cmd');
                if (cmd) {
                  fs.appendFileSync('server_input', cmd + '\n');
                }
                res.writeHead(302, {'Location': '/'});
                res.end();
              });
            } else if (req.url === '/fetch_logs') {
              const logPath = path.join(__dirname, 'logs', 'latest.log');
              if (fs.existsSync(logPath)) {
                const content = fs.readFileSync(logPath, 'utf8');
                // Increased to 100 lines for better visibility
                const lines = content.split('\n').slice(-100).join('\n');
                res.end(lines);
              } else {
                res.end("Server starting... logs appearing soon.");
              }
            } else {
              res.writeHead(200, {'Content-Type': 'text/html'});
              res.end(`
                <html>
                <head>
                  <title>MC Admin Console</title>
                  <style>
                    * { box-sizing: border-box; }
                    body { background: #0c0c0c; color: #00ff41; font-family: 'Consolas', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                    #log-win { 
                      background: #000; border: 1px solid #333; padding: 15px; 
                      flex-grow: 1; overflow-y: auto; white-space: pre-wrap; 
                      margin-bottom: 15px; font-size: 13px; line-height: 1.5; color: #00ff41;
                      word-break: break-all;
                    }
                    .cmd-bar { display: flex; gap: 10px; flex-shrink: 0; padding-bottom: 10px; }
                    input { flex-grow: 1; background: #1a1a1a; border: 1px solid #444; color: white; padding: 12px; border-radius: 4px; outline: none; font-family: inherit; }
                    button { background: #00ff41; color: black; border: none; padding: 0 30px; border-radius: 4px; cursor: pointer; font-weight: bold; }
                    button:hover { background: #00cc33; }
                  </style>
                </head>
                <body>
                  <h3 style="color: white; margin: 0 0 10px 0; flex-shrink: 0;">🛡️ Remote Terminal</h3>
                  <div id="log-win">Loading Stream...</div>
                  <form class="cmd-bar" method="POST">
                    <input name="cmd" placeholder="Execute any command..." autofocus autocomplete="off">
                    <button>RUN</button>
                  </form>
                  <script>
                    let userScrolled = false;
                    const win = document.getElementById('log-win');
                    
                    win.addEventListener('scroll', () => {
                      const atBottom = win.scrollHeight - win.clientHeight <= win.scrollTop + 50;
                      userScrolled = !atBottom;
                    });

                    function poll() {
                      fetch('/fetch_logs').then(r => r.text()).then(d => {
                        win.innerText = d;
                        if (!userScrolled) {
                          win.scrollTop = win.scrollHeight;
                        }
                      });
                    }
                    setInterval(poll, 2000);
                    poll();
                  </script>
                </body></html>
              `);
            }
          }).listen(8080);
          EOF

          # Start Custom Console
          node console.js &

          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi
          if [ -f server.properties ]; then
            sed -i "s/online-mode=.*/online-mode=false/" server.properties
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          # AUTO-SAVE LOOP (Every 2 Minutes)
          (
            while true; do
              sleep 120
              if [ -p server_input ]; then
                echo "save-all" > server_input
              else
                break
              fi
            done
          ) & 
          
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -Dsun.net.inetaddr.ttl=0 -Dio.netty.eventLoopThreads=8 -jar server.jar nogui &
          SERVER_PID=$!
          
          sleep 350m
          echo "stop" > server_input
          wait $SERVER_PID
          rm -f server_input

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          rm -rf plugins/DiscordSRV/ logs/ plugins/connect/token.json ngrok.log console.js
          find plugins/ -name ".git" -exec rm -rf {} +
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          fi
          curl -L -X POST -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
