name: Minecraft Server Runner
concurrency:
  group: minecraft-server
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Prepare Plugins
        run: |
          mkdir -p plugins/connect
          mkdir -p plugins/AuthMe
          mkdir -p plugins/PlayerStats
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json
          
          # FIXED: Create config if missing so the runner doesn't exit
          if [ ! -f "plugins/connect/config.yml" ]; then
            echo "enabled: true" > plugins/connect/config.yml
          fi

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf logs/* plugins/spark/tmp/*
          rm -f server_input ngrok.log console.js

          cleanup() {
            echo "⚠️ Shutdown signal received! Forcing final save..."
            echo "stop" > server_input
            sleep 15
            git config --global user.email "server-bot@example.com"
            git config --global user.name "ServerBot"
            rm -rf plugins/DiscordSRV/config.yml console.js ngrok.log plugins/connect/token.json logs/* plugins/spark/tmp/*
            git add .
            git commit -m "Emergency Save [skip ci]" || true
            git push --force || true
          }
          trap cleanup SIGTERM SIGINT

          # --- NGROK TCP FIX ---
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # We use TCP for Minecraft and HTTP for your Console
          ngrok tcp 25565 --log=stdout > ngrok.log &
          sleep 5
          echo "🔗 YOUR PUBLIC IP FOR PLAYERS:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
          
          # --- CONSOLE SCRIPT ---
          cat << 'EOF' > console.js
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          http.createServer((req, res) => {
            if (req.method === 'POST') {
              let body = '';
              req.on('data', chunk => { body += chunk.toString(); });
              req.on('end', () => {
                const params = new URLSearchParams(body);
                const cmd = params.get('cmd');
                if (cmd) { fs.appendFileSync('server_input', cmd + '\n'); }
                res.writeHead(302, {'Location': '/'});
                res.end();
              });
            } else if (req.url === '/fetch_logs') {
              const logPath = path.join(__dirname, 'logs', 'latest.log');
              if (fs.existsSync(logPath)) {
                const content = fs.readFileSync(logPath, 'utf8');
                res.end(content.split('\n').slice(-100).join('\n'));
              } else { res.end("Server starting..."); }
            } else {
              res.writeHead(200, {'Content-Type': 'text/html'});
              res.end(`<html><body style="background:#000;color:#0f0;font-family:monospace;"><h3>🛡️ Console</h3><pre id="l"></pre><form method="POST"><input name="cmd" autofocus><button>SEND</button></form><script>setInterval(()=>{fetch('/fetch_logs').then(r=>r.text()).then(d=>document.getElementById('l').innerText=d)},2000)</script></body></html>`);
            }
          }).listen(8080);
          EOF
          node console.js &

          # --- CONFIG FIXES ---
          if [ -f server.properties ]; then
            sed -i "s/online-mode=.*/online-mode=false/" server.properties
            sed -i "s/server-ip=.*/server-ip=/" server.properties
            sed -i "s/enable-query=.*/enable-query=true/" server.properties
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          # AUTO-SAVE
          (
            while true; do
              sleep 120
              echo "save-all" > server_input
              git config --global user.email "server-bot@example.com"
              git config --global user.name "ServerBot"
              git add .
              git commit -m "Live Progress Sync [skip ci]" || echo "No changes"
              git push --force || echo "Push failed"
            done
          ) & 
          
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -jar server.jar nogui &
          SERVER_PID=$!
          
          sleep 350m
          echo "stop" > server_input
          wait $SERVER_PID
