name: Minecraft Server 24/7

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  minecraft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 1. Install Minekube
        run: |
          mkdir -p plugins/connect
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar

      - name: 2. Create Configs
        run: |
          # Configure server.properties
          cat <<EOF > server.properties
          online-mode=false
          max-players=1000
          EOF

          # Configure Minekube Token using your secret
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json

          # Configure Minekube Endpoint (FLUSH LEFT - NO SPACES)
          cat <<EOF > plugins/connect/config.yml
          endpoint: "binwalksmp"
          passthrough: true
           EOF

          # Verification Check
          echo "--- Minekube Config Check ---"
          cat plugins/connect/config.yml
          echo "-----------------------------"

      - name: 3. Launch & Ultra-Save
        run: |
          echo "eula=true" > eula.txt
          if [ ! -f "server.jar" ]; then
            echo "Error: server.jar not found!"
            exit 1
          fi
          chmod +x server.jar
          
          # Start the server with a pipe for input
          mkfifo server_input
          tail -f server_input | java -Xms2G -Xmx7G -jar server.jar nogui &
          PID=$!
          
          # ULTRA-SAVE LOOP: Forces a save every 1 second
          ( 
            while kill -0 $PID 2>/dev/null; do 
              echo "save-all" > server_input
              sleep 1
            done 
          ) &

          # Run for 5 hours and 50 minutes (21000 seconds)
          sleep 21000
          
          echo "stop" > server_input
          sleep 40
          rm server_input

      - name: 4. Push Progress to GitHub
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Cleanup sensitive token before push
          rm -f plugins/connect/token.json
          
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-save world progress [skip ci]"
            git push origin main --force
          else
            echo "No changes to commit."
          fi
