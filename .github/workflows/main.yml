name: Minecraft Server Runner

concurrency:
  group: minecraft-server
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ restart_server ]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download & Configure Plugins
        run: |
          mkdir -p plugins/connect
          mkdir -p plugins/AuthMe
          mkdir -p plugins/PlayerStats
          
          # 1. Download Minekube Connect
          curl -L -o plugins/connect-spigot.jar https://github.com/minekube/connect-java/releases/latest/download/connect-spigot.jar
          
          # 2. Correct Minekube Config (This is the real key for offline players)
          cat <<EOF > plugins/connect/config.yml
          endpoint: "binwalksmp"
          passthrough: true
          EOF
          
          # 3. Inject Minekube Token
          echo "{\"token\":\"${{ secrets.MINEKUBE_TOKEN }}\"}" > plugins/connect/token.json
          sleep 5

      - name: Run Server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MANAGEMENT_SECRET: ${{ secrets.MANAGEMENT_SECRET }}
        run: |
          # 1. Inject Discord Token
          if [ -f plugins/DiscordSRV/config.yml ]; then
            sed -i "s/BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" plugins/DiscordSRV/config.yml
          fi

          # 2. Fix server.properties WITHOUT deleting it
          if [ -f server.properties ]; then
            # Force offline mode for AuthMe
            sed -i "s/online-mode=.*/online-mode=false/" server.properties
            # Update max players
            sed -i "s/max-players=.*/max-players=1000/" server.properties
            # Inject Management Secret (Since you left it blank in the file)
            sed -i "s/management-server-secret=.*/management-server-secret=$MANAGEMENT_SECRET/" server.properties
          fi
          
          chmod +x server.jar
          mkfifo server_input
          
          # 10-MINUTE AUTO-SAVE LOOP
          (
            while true; do
              sleep 600
              echo "save-all" > server_input
              echo "say [Auto-Save] Progress secured to disk." > server_input
            done
          ) & 

          # Start Server
          tail -f server_input | java -Xms2G -Xmx14G -XX:+UseG1GC -Dsun.net.inetaddr.ttl=0 -Dio.netty.eventLoopThreads=8 -jar server.jar nogui &
          
          # 6-hour cycle (350 mins)
          sleep 350m
          
          echo "say Server cycling for auto-save. Back in 2 minutes!" > server_input
          echo "save-all" > server_input
          echo "stop" > server_input
          wait $!

      - name: Save World & Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "server-bot@example.com"
          git config --global user.name "ServerBot"
          
          find plugins/ -name ".git" -exec rm -rf {} +
          
          # CLEANUP: Remove secrets before committing
          rm -f server_input
          rm -f plugins/connect/token.json
          
          # 3. SELECTIVE SAVE
          git add world/ world_nether/ world_the_end/
          git add server.properties
          git add plugins/Essentials/userdata/
          git add plugins/LuckPerms/
          git add plugins/PlayerPoints/
          git add plugins/AuthMe/
          git add plugins/PlayerStats/
          git add plugins/Kryptonite/
          git add plugins/connect/config.yml
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated world save [skip ci]"
            git push
          else
            echo "No changes detected."
          fi
          
          # Trigger Restart
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "restart_server"}'
